<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Cars — F1RST MOTORS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="grain"></div>

<header class="nav">
  <a href="index.html" class="logo">F1RST<span>MOTORS</span></a>
  <nav class="nav-links">
    <a href="index.html#about">About Us</a>
    <a href="index.html#contact">Contact Us</a>
    <a href="index.html#news">News</a>
    <a href="cars.html" class="active">Discover Cars</a>
  </nav>
  <div class="nav-actions">
    <button class="icon-btn" id="searchToggle" aria-label="Search">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" aria-label="Language">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="btn-ghost">Sign in</button>
  </div>
</header>

<main class="catalog">
  <div class="catalog-head">
    <h1>Discover Cars</h1>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" id="carSearch" placeholder="Search cars...">
    </div>
  </div>

  <div class="car-grid" id="carGrid">

    <article class="car-card" data-name="porsche 911">
      <div class="tilt-inner">
        <div class="car-card-stage">
          <div class="car3d car3d--sport small">
            <div class="car-shadow"></div>
            <div class="car-body sport c-silver">
              <div class="car-cabin"></div><div class="car-hood"></div><div class="car-trunk"></div>
              <div class="car-window win-front"></div><div class="car-window win-rear"></div>
              <div class="car-grille"></div>
              <div class="headlight hl-l"></div><div class="headlight hl-r"></div>
              <div class="wheel wl-front"><div class="rim"></div></div>
              <div class="wheel wl-rear"><div class="rim"></div></div>
              <div class="reflection"></div>
            </div>
          </div>
        </div>
        <div class="car-card-info">
          <h3>Porsche 911</h3>
          <button class="btn-outline small">Request</button>
        </div>
      </div>
    </article>

    <article class="car-card" data-name="bmw m4 g82">
      <div class="tilt-inner">
        <div class="car-card-stage">
          <div class="car3d car3d--sport small">
            <div class="car-shadow"></div>
            <div class="car-body sport c-white">
              <div class="car-cabin"></div><div class="car-hood"></div><div class="car-trunk"></div>
              <div class="car-window win-front"></div><div class="car-window win-rear"></div>
              <div class="car-grille"></div>
              <div class="headlight hl-l"></div><div class="headlight hl-r"></div>
              <div class="wheel wl-front"><div class="rim"></div></div>
              <div class="wheel wl-rear"><div class="rim"></div></div>
              <div class="reflection"></div>
            </div>
          </div>
        </div>
        <div class="car-card-info">
          <h3>BMW M4 G82</h3>
          <button class="btn-outline small">Request</button>
        </div>
      </div>
    </article>

    <article class="car-card" data-name="bmw m5 f90">
      <div class="tilt-inner">
        <div class="car-card-stage">
          <div class="car3d car3d--sedan small">
            <div class="car-shadow"></div>
            <div class="car-body c-graphite">
              <div class="car-cabin"></div><div class="car-hood"></div><div class="car-trunk"></div>
              <div class="car-window win-front"></div><div class="car-window win-rear"></div>
              <div class="car-grille"></div>
              <div class="headlight hl-l"></div><div class="headlight hl-r"></div>
              <div class="wheel wl-front"><div class="rim"></div></div>
              <div class="wheel wl-rear"><div class="rim"></div></div>
              <div class="reflection"></div>
            </div>
          </div>
        </div>
        <div class="car-card-info">
          <h3>Bmw m5 F90</h3>
          <button class="btn-outline small">Request</button>
        </div>
      </div>
    </article>

    <article class="car-card" data-name="bmw m8">
      <div class="tilt-inner">
        <div class="car-card-stage">
          <div class="car3d car3d--sport small">
            <div class="car-shadow"></div>
            <div class="car-body sport c-black">
              <div class="car-cabin"></div><div class="car-hood"></div><div class="car-trunk"></div>
              <div class="car-window win-front"></div><div class="car-window win-rear"></div>
              <div class="car-grille"></div>
              <div class="headlight hl-l"></div><div class="headlight hl-r"></div>
              <div class="wheel wl-front"><div class="rim"></div></div>
              <div class="wheel wl-rear"><div class="rim"></div></div>
              <div class="reflection"></div>
            </div>
          </div>
        </div>
        <div class="car-card-info">
          <h3>Bmw m8</h3>
          <button class="btn-outline small">Request</button>
        </div>
      </div>
    </article>

  </div>
</main>

<footer class="site-footer">
  <span>© 2026 F1RST MOTORS</span>
  <span class="footer-dim">Concept build — 3D interface demo</span>
</footer>

<script src="js/script.js"></script>
</body>
</html>
